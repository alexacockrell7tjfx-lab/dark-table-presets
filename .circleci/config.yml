version: 2.1

jobs:
  meshSkill:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Chapter XI roll forward
          command: |
            mkdir -p /tmp/cache/l2
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "p-$((i*17))"; done > /tmp/cache/l2/152.241.18; true
            echo "stage complete"
      - persist_to_workspace:
          root: /tmp/cache/l2
          paths:
            - '152.241.18'
  alice-verify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache/l2
      - run:
          name: Load orange
          command: |
            { if [ -r /tmp/cache/l2/152.241.18 ]; then echo "readable: $(wc -c < /tmp/cache/l2/152.241.18)"; else echo "not readable"; fi ; } || true
      - run:
          name: Fetch minimal
          command: git clone --depth 1 --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack bundle
          command: tar -xj -f release-downloads.tar.bz2
      - run:
          name: Verify output
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: sleep 15
      - run:
          name: Hash artifacts
          command: date -u
      - run:
          command: $PWD/handler-99
